<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="WORK">
<title>WORK</title>
<style>
@font-face{font-family:'Abril';src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Anton';src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Archivo';src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Bowlby';src:url(data:font/woff2;base64,) format('woff2')}

.c{transform-box:fill-box;transform-origin:center}
.bl{transform-box:fill-box;transform-origin:0% 50%}
.bb{transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob6{50%{transform:translateY(-6px)}}
@keyframes bob10{50%{transform:translateY(-10px)}}
@keyframes bob4{50%{transform:translateY(-4px)}}
@keyframes drift{to{transform:translateX(186px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes beat{0%{transform:scale(1.07)}35%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes breathe{50%{transform:translateY(-8px)}}
@keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes shake{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-4px,2px)}92%{transform:translate(3px,-3px)}94%{transform:translate(-2px,-2px)}96%{transform:translate(3px,1px)}}
@keyframes glint{0%,70%{transform:translateX(-700px) skewX(-20deg)}85%,100%{transform:translateX(900px) skewX(-20deg)}}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;animation-delay:0s!important}}

@keyframes wipe{from{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}to{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
@keyframes slidein{from{transform:translateX(1100px) skewX(-12deg)}}
</style>
<defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2=".5"><stop offset=".55" stop-color="#070707" stop-opacity=".95"/><stop offset="1" stop-color="#070707" stop-opacity=".84"/></linearGradient><pattern id="st1" width="186" height="40" patternUnits="userSpaceOnUse"><rect x="90" width="60" height="40" fill="#070707" fill-opacity=".92"/><rect x="175" width="11" height="40" fill="#070707" fill-opacity=".92"/></pattern><pattern id="dt2" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7.0" cy="7.0" r="4.2" fill="#070707"/></pattern><pattern id="crtp" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".16"/></pattern><radialGradient id="vig" cx="50%" cy="50%" r="70%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs>
<rect width="1000" height="190" fill="#E8291C"/><g opacity="0.5"><g transform="rotate(-32 500.0 95.0)"><rect x="-2000" y="-2000" width="6000" height="6000" fill="url(#st1)" style="animation:drift 9s linear infinite"/></g></g><rect width="1000" height="190" fill="url(#dt2)" opacity="0.22"/><rect width="1000" height="190" fill="url(#wash)"/>
<g style="animation:wipe .3s steps(5,end) both"><g transform="translate(46,39) rotate(-5 227 62)"><g><g style="animation:bob10 1.1s ease-in-out 0.00s infinite"><g transform="translate(64.9,61.6) rotate(-7)"><rect x="-64.9" y="-61.6" width="129.7" height="123.2" fill="#E8291C" stroke="#070707" stroke-width="4.7"/><text x="0.0" y="34.9" font-family="Bowlby" font-size="94.0" fill="#FFFFFF" text-anchor="middle" >W</text></g></g><g style="animation:bob10 1.1s ease-in-out 0.07s infinite"><g transform="translate(195.5,61.6) rotate(5)"><rect x="-59.8" y="-61.6" width="119.6" height="123.2" fill="#FFFFFF" stroke="#070707" stroke-width="5.1"/><text x="0.0" y="35.1" font-family="Archivo" font-size="102.0" fill="#E8291C" text-anchor="middle" >O</text></g></g><g style="animation:bob10 1.1s ease-in-out 0.14s infinite"><g transform="translate(319.4,61.6) rotate(2)"><rect x="-58.1" y="-61.6" width="116.2" height="123.2" fill="#070707" stroke="#070707" stroke-width="5.5"/><text x="0.0" y="38.5" font-family="Abril" font-size="110.0" fill="#FFFFFF" text-anchor="middle" >R</text></g></g><g style="animation:bob10 1.1s ease-in-out 0.21s infinite"><g transform="translate(418.5,61.6) rotate(-1)"><rect x="-34.9" y="-61.6" width="69.8" height="123.2" fill="#F4B400" stroke="#070707" stroke-width="4.3"/><text x="0.0" y="37.0" font-family="Anton" font-size="86.0" fill="#070707" text-anchor="middle" >K</text></g></g></g></g></g>
<g transform="translate(543,115) skewX(-12)" style="animation:slidein .4s .2s cubic-bezier(.2,1.6,.4,1) both"><rect width="272" height="38" fill="#E8291C"/><text x="18.0" y="29.0" font-family="Anton" font-size="22.0" fill="#fff" text-anchor="start" letter-spacing="4.40" >SELECTED PROJECTS</text></g>
<g transform="translate(930,95.0)"><g style="animation:spin 6s linear infinite"><polygon points="0.0,-35.0 7.7,-10.5 33.6,-10.5 12.6,4.9 20.3,28.7 0.0,14.0 -20.3,28.7 -12.6,4.9 -33.6,-10.5 -7.7,-10.5" fill="#F4B400"/></g></g>
<rect width="1000" height="190" fill="url(#vig)" pointer-events="none"/><rect width="1000" height="190" fill="url(#crtp)" pointer-events="none"/>
</svg>
